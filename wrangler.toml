# Reelmap Worker. Serves the SPA and proxies TMDB under /api/*.
# The TMDB token is a Worker secret named TMDB_READ_ACCESS_TOKEN.
# Set it with the wrangler "secret put" command (see README). Never put it here.
name = "reelmap"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Custom domain. The zone must be on the same Cloudflare account.
routes = [
  { pattern = "where.hatethespurs.com", custom_domain = true }
]

[build]
command = "npm run build"

[assets]
directory = "./dist/public"
binding = "ASSETS"
# Let the Worker see every request so it can add security headers,
# route /api/* and serve the SPA shell for /title/* paths.
run_worker_first = true

# Optional second-level cache in Workers KV.
# 1. Create a namespace named CACHE with the wrangler kv namespace command.
# 2. Uncomment the block below and paste the id it prints.
# The Worker uses the binding when it exists and skips it when it does not.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<namespace id>"
